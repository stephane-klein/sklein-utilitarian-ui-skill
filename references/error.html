<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error pages — AppName</title>
  <style>
    :root {
      --bg:           #fff;
      --bg-subtle:    #f7f7f7;
      --border:       #ddd;
      --text:         #1a1a1a;
      --text-muted:   #666;
      --link:         #0066cc;
      --accent:       #0066cc;
      --danger:       #cc0000;
      --font: system-ui, -apple-system, sans-serif;
      --mono: ui-monospace, 'Cascadia Code', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font: 15px/1.6 var(--font);
      color: var(--text);
      background: var(--bg);
    }

    /* ── Header ── */
    .header {
      border-bottom: 1px solid var(--border);
      padding: 9px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .site-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }

    .site-name:hover { text-decoration: underline; }

    nav a { font-size: 13px; color: var(--text-muted); text-decoration: none; }
    nav a + a::before { content: ' · '; }
    nav a:hover { color: var(--link); text-decoration: underline; }

    /* ── Main ── */
    main {
      max-width: 640px;
      padding: 48px 20px 64px;
    }

    /* ── Error block ── */
    .error-code {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 10px;
    }

    .error-code.is-danger { color: var(--danger); }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -.02em;
      margin-bottom: 10px;
    }

    .error-desc {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 24px;
      max-width: 480px;
    }

    .error-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 6px 16px;
      border-radius: 3px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover { background: #0055bb; }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border-color: var(--border);
      font-weight: 400;
    }

    .btn-ghost:hover { background: var(--bg-subtle); color: var(--text); }

    /* Detail technique (500 seulement) */
    .error-detail {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .error-detail summary {
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .error-detail summary:hover { color: var(--text); }

    .error-detail pre {
      margin-top: 10px;
      font-family: var(--mono);
      font-size: 12px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 12px;
      overflow-x: auto;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Maintenance countdown */
    .maintenance-meta {
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .maintenance-meta strong {
      font-family: var(--mono);
      color: var(--text);
    }

    /* ── Demo switcher ── */
    .demo {
      position: fixed;
      bottom: 16px;
      right: 16px;
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 11px;
      color: #999;
    }

    .demo button {
      padding: 3px 8px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      border-radius: 2px;
      cursor: pointer;
      font: 11px var(--font);
      color: var(--text-muted);
    }

    .demo button.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 11px 20px;
      font-size: 12px;
      color: var(--text-muted);
    }

    footer a { color: var(--text-muted); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header class="header">
    <a href="/" class="site-name">AppName</a>
    <nav id="header-nav">
      <a href="/dashboard">Dashboard</a>
      <a href="/settings">Settings</a>
      <a href="/logout">Sign out</a>
    </nav>
  </header>

  <main id="main"></main>

  <footer id="footer">
    <a href="/docs">Documentation</a> ·
    <a href="/about">About</a> ·
    <a href="/status">Status</a>
  </footer>

  <div class="demo">
    <span>demo:</span>
    <button class="active" onclick="show('404')">404</button>
    <button onclick="show('403')">403</button>
    <button onclick="show('500')">500</button>
    <button onclick="show('maintenance')">maintenance</button>
  </div>

  <script>
    const pages = {

      '404': {
        title: 'Error pages — AppName',
        nav: true,
        footer: true,
        html: `
          <p class="error-code">404</p>
          <h1>Page not found</h1>
          <p class="error-desc">
            This page doesn't exist or has been moved.
          </p>
          <div class="error-actions">
            <a href="/" class="btn">Go to dashboard</a>
            <a href="javascript:history.back()" class="btn btn-ghost">Go back</a>
          </div>`
      },

      '403': {
        title: 'Access denied — AppName',
        nav: true,
        footer: true,
        html: `
          <p class="error-code is-danger">403</p>
          <h1>Access denied</h1>
          <p class="error-desc">
            You don't have permission to view this page.
            If you think this is a mistake, contact your administrator.
          </p>
          <div class="error-actions">
            <a href="/" class="btn">Go to dashboard</a>
            <a href="mailto:admin@example.com" class="btn btn-ghost">Contact admin</a>
          </div>`
      },

      '500': {
        title: 'Server error — AppName',
        nav: true,
        footer: true,
        html: `
          <p class="error-code is-danger">500</p>
          <h1>Something went wrong</h1>
          <p class="error-desc">
            An unexpected error occurred on our end.
            The issue has been logged. Try again in a moment.
          </p>
          <div class="error-actions">
            <a href="javascript:location.reload()" class="btn">Try again</a>
            <a href="/" class="btn btn-ghost">Go to dashboard</a>
            <a href="/status" class="btn btn-ghost">Check status</a>
          </div>
          <div class="error-detail">
            <details>
              <summary>Technical details</summary>
              <pre>Error ID : a3f9c2d1-8b4e-4f12-9c7a-e6d0b5f1a8c3
Timestamp: 2025-07-07T14:23:01Z
Path     : /api/entries/sync
Message  : pq: connection refused (postgresql://localhost:5432)</pre>
            </details>
          </div>`
      },

      'maintenance': {
        title: 'Maintenance — AppName',
        nav: false,
        footer: false,
        html: `
          <p class="error-code">Maintenance</p>
          <h1>We'll be right back</h1>
          <p class="error-desc">
            AppName is down for scheduled maintenance.
            We're upgrading the database and expect to be back shortly.
          </p>
          <div class="maintenance-meta">
            Started at <strong>14:00 UTC</strong> ·
            Expected back by <strong>15:30 UTC</strong> ·
            <a href="https://status.example.com">status page</a>
          </div>`
      }
    }

    function show(key) {
      const p = pages[key]
      document.title = p.title
      document.getElementById('main').innerHTML = p.html
      document.getElementById('header-nav').style.display = p.nav ? '' : 'none'
      document.getElementById('footer').style.display = p.footer ? '' : 'none'
      document.querySelectorAll('.demo button').forEach(b => {
        b.classList.toggle('active', b.textContent === key)
      })
    }

    show('404')
  </script>

</body>
</html>
