<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — AppName</title>
  <style>
    :root {
      --bg:           #fff;
      --bg-subtle:    #f7f7f7;
      --border:       #ddd;
      --text:         #1a1a1a;
      --text-muted:   #666;
      --link:         #0066cc;
      --accent:       #0066cc;
      --accent-hover: #0055bb;
      --danger:       #cc0000;
      --font: system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font: 15px/1.6 var(--font);
      color: var(--text);
      background: var(--bg);
    }

    .header {
      border-bottom: 1px solid var(--border);
      padding: 9px 20px;
    }

    .site-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }

    .site-name:hover { text-decoration: underline; }

    main {
      max-width: 480px;
      padding: 36px 20px 64px;
    }

    h1 {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -.01em;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
      max-width: 340px;
    }

    form { max-width: 340px; }

    .field { margin-bottom: 13px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 3px;
    }

    input[type=email] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 3px;
      font: inherit;
      font-size: 14px;
      color: var(--text);
      background: #fff;
    }

    input:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      border-color: var(--accent);
    }

    .actions {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    button[type=submit] {
      padding: 6px 16px;
      background: var(--accent);
      color: #fff;
      border: 1px solid var(--accent);
      border-radius: 3px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button[type=submit]:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    /* ── État "envoyé" ── */
    .sent {
      display: none;
      max-width: 340px;
    }

    .sent.visible { display: block; }

    .sent p {
      font-size: 14px;
      margin-bottom: 10px;
    }

    .sent p strong {
      font-family: ui-monospace, monospace;
      font-weight: 600;
    }

    .sent .hint {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ── Liens bas de page ── */
    .form-meta {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-muted);
    }

    .form-meta a { color: var(--link); }

    footer {
      border-top: 1px solid var(--border);
      padding: 11px 20px;
      font-size: 12px;
      color: var(--text-muted);
    }

    footer a { color: var(--text-muted); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header class="header">
    <a href="/" class="site-name">AppName</a>
  </header>

  <main>
    <h1>Reset password</h1>
    <p class="subtitle">Enter your email and we'll send you a link to reset your password.</p>

    <!-- État : formulaire -->
    <form id="form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               autocomplete="email" autofocus required>
      </div>

      <div class="actions">
        <button type="submit">Send reset link</button>
      </div>
    </form>

    <!-- État : envoyé -->
    <div class="sent" id="sent">
      <p>We sent a reset link to <strong id="sent-email"></strong>.</p>
      <p class="hint">
        Check your inbox — it may take a minute or two.
        No email? <a href="#" onclick="showForm(event)">Try again</a> or check your spam folder.
      </p>
    </div>

    <p class="form-meta">
      <a href="/login">Back to sign in</a> ·
      <a href="/">Homepage</a>
    </p>
  </main>

  <footer>
    <a href="/docs">Documentation</a> ·
    <a href="/about">About</a> ·
    <a href="/status">Status</a>
  </footer>

  <script>
    const form    = document.getElementById('form')
    const sent    = document.getElementById('sent')
    const emailEl = document.getElementById('email')

    form.addEventListener('submit', e => {
      e.preventDefault()
      if (!emailEl.value.includes('@')) {
        emailEl.focus()
        return
      }
      document.getElementById('sent-email').textContent = emailEl.value
      form.style.display = 'none'
      sent.classList.add('visible')
    })

    function showForm(e) {
      e.preventDefault()
      form.style.display = ''
      sent.classList.remove('visible')
      emailEl.focus()
    }
  </script>

</body>
</html>
